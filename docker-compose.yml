services:
  # =========================================================================
  # 1. FRONTEND: Пользовательский веб-интерфейс (Nginx Alpine SPA)
  # Содержит Кнопку 1 (Запрос БД) и Кнопку 2 (Запрос Web-сервиса)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - game-network

  # =========================================================================
  # 2. BACKEND: REST API сервис (Node.js 20 Express)
  # Обеспечивает CRUD-операции с PostgreSQL и интеграцию с Web-сервисом
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game-backend
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/gamedb
      - CATALOG_SERVICE_URL=http://web-service:5001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - game-network

  # =========================================================================
  # 3. DATABASE: Реляционная СУБД (PostgreSQL 16 Alpine)
  # Хранит игровую библиотеку пользователя с healthcheck и persistent volume
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: game-database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gamedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamedb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - game-network

  # =========================================================================
  # 4. WEB-SERVICE (ВАРИАНТ 37): Каталог видеоигр
  # Поиск игр по жанрам и минимальным системным требованиям
  # =========================================================================
  web-service:
    build:
      context: ./web-service
      dockerfile: Dockerfile
    container_name: game-web-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: unless-stopped
    networks:
      - game-network

# Единая виртуальная сеть для изолированного общения контейнеров
networks:
  game-network:
    driver: bridge

# Сохранение состояния базы данных между перезапусками
volumes:
  postgres_data:
    driver: local
